  <rect x="12" y="54" width="30" height="5" rx="2.5" fill="rgba(255,255,255,0.65)"/>
  <rect x="12" y="69" width="30" height="5" rx="2.5" fill="rgba(255,255,255,0.65)"/>
  <rect x="18" y="86" width="24" height="4" rx="2" fill="rgba(255,255,255,0.45)"/>

  <!-- Play triangle -->
